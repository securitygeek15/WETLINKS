<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetlinks - URL Shortener</title>
  <style>
    /* --- GenZ Core Aesthetic --- */
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      --accent: #8e44ad;
      --card-bg: rgba(255, 255, 255, 0.25);
      --text-color: #222;
      --button-gradient: linear-gradient(135deg, #ff9966, #ff5e62);
      --font-main: 'Poppins', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-main);
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 2px 2px 10px rgba(142, 68, 173, 0.2);
      margin-bottom: 1rem;
    }

    .tagline {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 2rem;
    }

    .formcontainer {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease-in-out;
    }

    .formcontainer:hover {
      transform: scale(1.02);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 250px;
    }

    input[type="text"] {
      padding: 0.8rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 5px rgba(142, 68, 173, 0.4);
    }

    button {
      background: var(--button-gradient);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      padding: 0.8rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease-in-out;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .content {
      margin-top: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 1.5rem;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .content p,
    .content h3 {
      color: var(--text-color);
      margin: 0.5rem 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    a:hover {
      text-decoration: underline;
      color: #6c3483;
    }

    footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
      opacity: 0.8;
      padding: 1rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      form {
        width: 90%;
      }

      .content {
        width: 90%;
      }
    }
  </style>
</head>

<body>
  <h1>⚡ Wetlinks</h1>
  <div class="tagline">Shrink your links. Share the vibe.</div>

  <div class="formcontainer">
    <form action="/shorten" method="post">
      <input type="text" name="long_url" placeholder="Paste your long URL here 🔗" required>
      <input type="text" name="customcode" placeholder="Custom code (optional)">
      <button type="submit">✨ Shorten It!</button>
    </form>
  </div>

  <div class="content">
    {% if short_url %}
    <p>Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
    {% endif %}

    {% if stats %}
    <h3>📊 Stats:</h3>
    <p>Original URL: {{ stats.long_url }}</p>
    <p>Clicks: {{ stats.clicks }}</p>
    <p>Created at: {{ stats.created_at }}</p>
    {% endif %}
  </div>

  
</body>

</html>
